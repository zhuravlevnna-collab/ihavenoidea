<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Зверополис: дело о пропавших точках</title>
<style>
:root{--bg:#7d1a24;--deep:#5a1019;--card:#fbf3ee;--ink:#3b1f26;--wine:#8b1c27;--soft:#f1d9d3;--ok:#2e7d4f;--bad:#b3261e}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(circle at 20% 0,#98242f,var(--bg) 45%,var(--deep));background-attachment:fixed;color:var(--ink);font-family:"Nunito","Trebuchet MS",Arial,sans-serif;padding:calc(16px + env(safe-area-inset-top,0px)) 14px calc(24px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:640px;margin:0 auto}
.logo{display:block;width:min(260px,60%);margin:0 auto 12px;border-radius:999px}
.bar{display:flex;justify-content:space-between;gap:8px;color:#fff;font-weight:800;margin-bottom:10px;flex-wrap:wrap}
.pill{background:rgba(0,0,0,.25);border-radius:999px;padding:6px 14px}
.card{background:var(--card);border-radius:28px;padding:22px}
h1,h2{font-family:"Rubik","Arial Black",sans-serif;color:var(--wine);margin:0 0 10px}
h1{font-size:1.8rem}h2{font-size:1.3rem}
p{line-height:1.5;margin:.5em 0}
.who{display:flex;gap:12px;align-items:flex-start;background:var(--soft);border-radius:18px;padding:12px 14px;margin:12px 0}
.who .av{font-size:2.2rem;line-height:1}
.rule{background:var(--wine);color:#fff;border-radius:16px;padding:10px 14px;font-weight:700;margin:12px 0}
.word{font-family:"Rubik","Arial Black",sans-serif;font-size:clamp(2rem,9vw,3rem);text-align:center;margin:18px 0;color:var(--ink);letter-spacing:.03em}
.gap{display:inline-block;min-width:1.1em;border-bottom:5px solid var(--wine);color:var(--wine);text-align:center}
u{text-decoration:none;background:var(--wine);color:#fff;border-radius:8px;padding:0 6px}
.opts{display:flex;gap:10px;flex-wrap:wrap}
button{font:inherit;font-weight:800;border:0;border-radius:18px;padding:14px 18px;cursor:pointer;background:var(--wine);color:#fff;flex:1;min-width:90px;font-size:1.2rem}
button:hover{background:#a3222f}button:focus-visible{outline:4px solid #f1d9d3;outline-offset:2px}
button.alt{background:var(--soft);color:var(--wine);font-size:1rem;padding:10px 14px}
button.alt:hover{background:#e8c8c0}
button:disabled{opacity:.45;cursor:default}
button.right{background:var(--ok)}button.wrong{background:var(--bad)}
.fb{border-radius:16px;padding:12px 14px;margin:12px 0;font-weight:700}
.fb.ok{background:#d9efe1;color:#1c5a37}.fb.no{background:#f7d9d6;color:#8a1d17}
.tools{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
pre{background:var(--soft);border-radius:14px;padding:12px;font-size:.85rem;overflow-x:auto;line-height:1.35;margin:10px 0}
.big{font-size:3rem;text-align:center}
.mt{margin-top:14px}
</style></head><body><div class="wrap">

document.querySelector(".bar .pill:nth-child(2)").textContent=`Точки Ё: ${S.pts}/35`}
function pick(b){const {q,o}=S.cur,ok=b.textContent==q[1];
$.querySelectorAll(".opts button").forEach(x=>{x.disabled=true;if(x.textContent==q[1])x.classList.add("right")});
if(S.l>0)document.getElementById("w").innerHTML=fmt(q[0],q[1]);

else{S.car--;b.classList.add("wrong");fb=`<div class="fb no">Мимо. Правильно: «${q[1]}». ${q[3]} −1 морковка.</div>`}
const out=!ok&&S.car==0;

$.innerHTML=`<div class="card"><div class="big">${e[1]}</div><h1 style="text-align:center">${e[2]}</h1><p style="text-align:center;font-weight:800">Вернули точек Ё: ${S.pts} из 35</p><p>${e[3]}</p><button id="re">Играть ещё раз</button></div>`;

start();
